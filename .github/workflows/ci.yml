name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: ${{ matrix.check }} (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        python: ['3.11', '3.15']
        check: [source, distribution]
        exclude:
          - check: distribution
            python: '3.15'
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Record environment and require link capabilities
        run: |
          mkdir -p ci-logs
          python - <<'PY' 2>&1 | tee ci-logs/environment.log
          import os
          from pathlib import Path
          import platform
          import subprocess
          import sys
          import tempfile

          print(platform.platform(), sys.version, sys.executable, sep='\n')
          options = {'check': True}
          if os.name == 'nt':
              options['creationflags'] = subprocess.CREATE_NO_WINDOW
          subprocess.run(['git', '--version'], **options)
          subprocess.run(['git', 'rev-parse', 'HEAD'], **options)
          if os.name == 'nt':
              subprocess.run(['powershell.exe', '-NoProfile', '-NonInteractive',
                              '-Command', '$PSVersionTable.PSVersion.ToString()'], **options)
          with tempfile.TemporaryDirectory() as temporary:
              root = Path(temporary)
              (root / 'file').write_text('probe', encoding='utf-8')
              (root / 'directory').mkdir()
              for name, directory in [('file', False), ('directory', True)]:
                  link = root / (name + '-link')
                  link.symlink_to(root / name, target_is_directory=directory)
                  if not link.is_symlink() or not link.samefile(root / name):
                      raise RuntimeError(f'{name} symlink capability unavailable')
          print('File and directory symlink capabilities verified')
          PY
      - name: Check changed whitespace
        if: matrix.check == 'source' && matrix.os == 'ubuntu-24.04' && matrix.python == '3.11'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base="$PR_BASE"
          elif [[ "$EVENT_NAME" == push && -n "$PUSH_BEFORE" && ! "$PUSH_BEFORE" =~ ^0+$ ]]; then
            base="$PUSH_BEFORE"
            if ! git cat-file -e "$base^{commit}"; then
              git fetch --no-tags origin "$base"
            fi
          elif [[ "$EVENT_NAME" == workflow_dispatch ]] && git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            base=HEAD^
          else
            base=$(git hash-object -t tree /dev/null)
          fi
          echo "Whitespace comparison: $base -> HEAD" | tee ci-logs/whitespace.log
          git diff --check "$base" HEAD 2>&1 | tee -a ci-logs/whitespace.log
      - name: Install source test dependencies
        if: matrix.check == 'source'
        run: python -m pip install -e '.[dev]' uv 2>&1 | tee ci-logs/install.log
      - name: Run source tests
        if: matrix.check == 'source'
        run: python -m unittest discover -s tests -v 2>&1 | tee ci-logs/unittest.log
      - name: Compile source and tests
        if: ${{ !cancelled() && matrix.check == 'source' }}
        run: python -m compileall -q src tests scripts 2>&1 | tee ci-logs/compileall.log
      - name: Install isolated build frontend
        if: matrix.check == 'distribution'
        run: python -m pip install build 2>&1 | tee ci-logs/install.log
      - name: Verify direct and sdist wheels
        if: matrix.check == 'distribution'
        run: python scripts/verify_distribution.py 2>&1 | tee ci-logs/distribution.log
      - name: Retain verification logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.check }}-${{ matrix.os }}-py${{ matrix.python }}-${{ github.run_attempt }}
          path: ci-logs/*.log
          retention-days: 14
          if-no-files-found: warn
