name: Agent integration

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agents-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agents:
    name: agents (ubuntu-24.04, latest CLIs)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: '1'
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
      - name: Install uv and the latest agent CLIs
        run: |
          mkdir -p ci-logs
          {
            python -m pip install uv
            npm install --global @openai/codex@latest @anthropic-ai/claude-code@latest
          } 2>&1 | tee ci-logs/install.log
      - name: Verify agent CLIs read the AEM setup
        run: python scripts/verify_agents.py 2>&1 | tee ci-logs/agents.log
      - name: Retain verification logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: logs-agents-${{ github.run_attempt }}
          path: ci-logs/*.log
          retention-days: 14
          if-no-files-found: warn
