[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-env-man"
version = "1.1.1"
description = "Deliver user-owned agent configuration and safely manage selected local targets"
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.11"
dependencies = ["click>=8.2,<9", "tomlkit>=0.13,<1"]

[project.optional-dependencies]
dev = ["coverage>=7.11,<8", "setuptools>=77.0.3"]

[project.scripts]
aem = "agent_env_man.cli:main"

[tool.setuptools]
packages = ["agent_env_man", "agent_env_man.commands", "agent_env_man.builtin_skills"]

[tool.setuptools.package-dir]
"" = "src"
"agent_env_man.builtin_skills" = "skills"

[tool.setuptools.package-data]
"agent_env_man.builtin_skills" = ["idk-aem/SKILL.md"]

[tool.setuptools.cmdclass]
build_py = "_build.BuildPy"

[tool.coverage.run]
source = ["src", "scripts"]
branch = true
relative_files = true
# Real CLI tests spawn Python children; merge their data before reporting.
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
precision = 2
skip_empty = true
