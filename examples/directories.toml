# Bootstrap defaults home to the user home directory when unbound.
# Override the initial binding with --root home=/absolute/parent.
# Targets are independent of agent skill and instruction locations.
version = 2

[sources.case-store]
type = "git"
repository = "https://github.com/OWNER/case-store.git"

[directories.cases]
source = "case-store"
subdir = "."

[directories.cases.install]
destination = "agent-loop"
mode = "link"

# Optional, using the same policy system as skills.
[directories.cases.update]
trigger = []
